<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SongHub Songbook</title>
<meta name="description" content="Browse 47,998 SongHub karaoke songs by title A–Z or by singer.">
<meta name="theme-color" content="#f5f3f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141118" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SongHub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="songs.js" as="script">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
/* Layout: a karaoke songbook. Sticky control deck (search, view, letter strip) over a long list whose song codes lead every row. */
:root{
  --bg:#f5f3f7; --surface:#ffffff; --ink:#1d1824; --muted:#6c6475; --line:#e3dee8;
  --accent:#b8226b; --accent-ink:#ffffff; --accent-soft:#f6dfeb; --code:#3d2a8c;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141118; --surface:#1d1922; --ink:#efeaf3; --muted:#a39bad; --line:#2f2938;
  --accent:#f0679f; --accent-ink:#1a0d14; --accent-soft:#3a1c2b; --code:#b8a6ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141118; --surface:#1d1922; --ink:#efeaf3; --muted:#a39bad; --line:#2f2938;
  --accent:#f0679f; --accent-ink:#1a0d14; --accent-soft:#3a1c2b; --code:#b8a6ff; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:28px 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;justify-content:space-between}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,44px);letter-spacing:-.02em;margin:0;line-height:1}
h1 span{color:var(--accent)}
.stats{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}
.deck{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 260px;position:relative;min-width:0}
.search input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:11px 38px 11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--accent)}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px;line-height:1}
.tabs{display:flex;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:3px}
.tabs button{font:inherit;font-weight:600;border:0;background:none;color:var(--muted);padding:8px 14px;border-radius:7px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.letters{display:flex;gap:3px;margin-top:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.letters::-webkit-scrollbar{display:none}
.letters button{flex:0 0 auto;min-width:30px;height:32px;font-family:var(--mono);font-weight:700;font-size:13px;border:0;border-radius:7px;background:transparent;color:var(--ink);cursor:pointer}
.letters button:hover{background:var(--accent-soft)}
.letters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.letters button:disabled{color:var(--line);cursor:default;background:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:22px 6px}
.heading h2{font-family:var(--display);font-weight:800;font-size:28px;margin:0;letter-spacing:-.01em;text-wrap:balance;min-width:0;overflow-wrap:anywhere}
.heading .sub{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.back{font:inherit;font-weight:600;border:0;background:none;color:var(--accent);cursor:pointer;padding:0;margin-top:18px}
ol.songs{list-style:none;margin:0;padding:0}
ol.songs li{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:baseline;padding:10px 4px;border-bottom:1px solid var(--line)}
.code{grid-row:span 2;font-family:var(--mono);font-weight:700;font-size:17px;color:var(--code);background:none;border:0;padding:2px 0;cursor:pointer;width:6.4ch;text-align:left;font-variant-numeric:tabular-nums;align-self:center}
.code:hover{color:var(--accent)}
.t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.a{font-size:13px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.a button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.a button:hover{color:var(--accent);text-decoration:underline}
ul.singers{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 20px}
ul.singers li{border-bottom:1px solid var(--line)}
ul.singers button{width:100%;display:flex;justify-content:space-between;gap:10px;align-items:baseline;font:inherit;text-align:left;background:none;border:0;color:var(--ink);padding:10px 4px;cursor:pointer}
ul.singers button:hover .n{color:var(--accent)}
ul.singers .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
ul.singers .n{font-family:var(--mono);font-size:12px;color:var(--muted);flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-block:4px 10px}
.chips button{font:inherit;font-size:13px;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.more{display:block;margin:18px auto 8px;font:inherit;font-weight:600;border:1.5px solid var(--ink);background:none;color:var(--ink);border-radius:999px;padding:10px 22px;cursor:pointer}
.more:hover{background:var(--ink);color:var(--bg)}
.empty{color:var(--muted);padding:30px 4px}
.hint{color:var(--muted);font-size:12px;padding-block:6px 40px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
@media (max-width:520px){.tabs{flex:1 1 100%}.tabs button{flex:1}.heading h2{font-size:24px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:520px){.letters button{min-width:36px;height:40px;font-size:14px}ol.songs li{padding:12px 4px}.code{font-size:18px}}
.install{font:inherit;font-weight:600;font-size:13px;border:1.5px solid var(--accent);color:var(--accent);background:none;border-radius:999px;padding:5px 12px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Song<span>Hub</span></h1>
    <div class="row"><button class="install" id="install" type="button" hidden>Install app</button><div class="stats"><b id="nSongs"></b> songs · <b id="nSingers"></b> singers</div></div>
  </header>
</div>
<div class="deck"><div class="wrap">
  <div class="row">
    <div class="search">
      <input id="q" type="search" placeholder="Search a title, singer or song number" autocomplete="off" aria-label="Search songs">
      <button id="clear" type="button" aria-label="Clear search" hidden>×</button>
    </div>
    <div class="tabs" role="group" aria-label="Browse by">
      <button id="tabTitles" type="button" aria-pressed="true">Titles A–Z</button>
      <button id="tabSingers" type="button" aria-pressed="false">Singers</button>
    </div>
  </div>
  <div class="letters" id="letters" role="group" aria-label="Jump to letter"></div>
</div></div>
<main class="wrap" id="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="songs.js"></script>
<script>
(function(){
const PAGE=150;
const LETTERS=['#'].concat('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''));
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n.toLocaleString('en-US');
function letterOf(s){const m=s.match(/[0-9A-Za-z]/);if(!m)return'#';const c=m[0].toUpperCase();return c>='A'&&c<='Z'?c:'#'}

// Index once: songs are pre-sorted by title, singers alphabetically.
const titleLetter={},singerLetter={},bySinger=ARTISTS.map(()=>[]);
LETTERS.forEach(l=>{titleLetter[l]=[];singerLetter[l]=[]});
const titleLC=new Array(SONGS.length);
SONGS.forEach((s,i)=>{titleLetter[letterOf(s[1])].push(i);bySinger[s[2]].push(i);titleLC[i]=s[1].toLowerCase()});
ARTISTS.forEach((a,i)=>singerLetter[letterOf(a)].push(i));
const artistLC=ARTISTS.map(a=>a.toLowerCase());
$('nSongs').textContent=fmt(SONGS.length);$('nSingers').textContent=fmt(ARTISTS.length);

const st={view:'titles',letter:'A',singer:null,q:'',shown:PAGE};
try{const v=localStorage.getItem('songhub.view');if(v==='titles'||v==='singers')st.view=v}catch(e){}

function songRows(ids,from,to,q){
  let h='';
  for(let k=from;k<to;k++){const s=SONGS[ids[k]];
    h+='<li><button class="code" type="button" data-copy="'+s[0]+'" title="Copy song number">'+s[0]+'</button>'+
       '<span class="t">'+hl(s[1],q)+'</span><span class="a"><button type="button" data-singer="'+s[2]+'">'+hl(ARTISTS[s[2]],q)+'</button></span></li>'}
  return h}
function hl(text,q){
  if(!q)return esc(text);const i=text.toLowerCase().indexOf(q);
  if(i<0)return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length))}
function moreBtn(total){return st.shown<total?'<button class="more" type="button" id="more">Show '+fmt(Math.min(PAGE,total-st.shown))+' more · '+fmt(total-st.shown)+' left</button>':''}

function renderLetters(){
  const src=st.view==='titles'?titleLetter:singerLetter;
  const active=!st.q&&st.singer===null;
  $('letters').innerHTML=LETTERS.map(l=>'<button type="button" data-letter="'+l+'" aria-pressed="'+(active&&st.letter===l)+'"'+(src[l].length?'':' disabled')+' title="'+fmt(src[l].length)+(st.view==='titles'?' songs':' singers')+'">'+l+'</button>').join('');
  $('tabTitles').setAttribute('aria-pressed',st.view==='titles');
  $('tabSingers').setAttribute('aria-pressed',st.view==='singers');
}

let searchCache=null;
function search(q){
  if(searchCache&&searchCache.q===q)return searchCache;
  const isNum=/^\d+$/.test(q);const songs=[];const singers=[];
  for(let i=0;i<SONGS.length;i++){
    if(titleLC[i].includes(q)||artistLC[SONGS[i][2]].includes(q)||(isNum&&(SONGS[i][0].startsWith(q)||SONGS[i][0].replace(/^0+/,'').startsWith(q))))songs.push(i)}
  if(isNum)songs.sort((a,b)=>{const ea=+SONGS[a][0]===+q,eb=+SONGS[b][0]===+q;return eb-ea});
  for(let i=0;i<ARTISTS.length;i++)if(artistLC[i].includes(q))singers.push(i);
  singers.sort((a,b)=>bySinger[b].length-bySinger[a].length);
  return searchCache={q,songs,singers}}

function render(){
  renderLetters();
  const m=$('main');let h='';
  if(st.q){
    const r=search(st.q);
    h+='<div class="heading"><h2>“'+esc(st.q)+'”</h2><span class="sub">'+fmt(r.songs.length)+' songs · '+fmt(r.singers.length)+' singers</span></div>';
    if(r.singers.length){
      h+='<div class="label">Singers</div><div class="chips">'+r.singers.slice(0,12).map(i=>'<button type="button" data-singer="'+i+'">'+esc(ARTISTS[i])+' · '+bySinger[i].length+'</button>').join('')+'</div>'}
    if(r.songs.length){h+='<ol class="songs">'+songRows(r.songs,0,Math.min(st.shown,r.songs.length),st.q)+'</ol>'+moreBtn(r.songs.length)}
    else h+='<p class="empty">No songs match “'+esc(st.q)+'”. Try fewer letters, or search by singer.</p>';
  }else if(st.singer!==null){
    const ids=bySinger[st.singer];
    h+='<button class="back" type="button" id="back">← Back to '+(st.view==='singers'?'singers':'titles')+' · '+st.letter+'</button>';
    h+='<div class="heading"><h2>'+esc(ARTISTS[st.singer])+'</h2><span class="sub">'+fmt(ids.length)+(ids.length===1?' song':' songs')+'</span></div>';
    h+='<ol class="songs">'+songRows(ids,0,Math.min(st.shown,ids.length))+'</ol>'+moreBtn(ids.length);
  }else if(st.view==='titles'){
    const ids=titleLetter[st.letter];
    h+='<div class="heading"><h2>Titles · '+st.letter+'</h2><span class="sub">'+fmt(ids.length)+' songs</span></div>';
    h+='<ol class="songs">'+songRows(ids,0,Math.min(st.shown,ids.length))+'</ol>'+moreBtn(ids.length);
  }else{
    const ids=singerLetter[st.letter];
    h+='<div class="heading"><h2>Singers · '+st.letter+'</h2><span class="sub">'+fmt(ids.length)+' singers</span></div>';
    h+='<ul class="singers">'+ids.slice(0,Math.min(st.shown*2,ids.length)).map(i=>'<li><button type="button" data-singer="'+i+'"><span class="nm">'+esc(ARTISTS[i])+'</span><span class="n">'+bySinger[i].length+'</span></button></li>').join('')+'</ul>';
    if(st.shown*2<ids.length)h+='<button class="more" type="button" id="more">Show more singers · '+fmt(ids.length-st.shown*2)+' left</button>';
  }
  h+='<p class="hint">Tap a song number to copy it.</p>';
  m.innerHTML=h;
}
function appendMore(){
  // Append the next page instead of re-rendering the whole list.
  const ol=document.querySelector('ol.songs');
  let ids=null;
  if(st.q)ids=search(st.q).songs;else if(st.singer!==null)ids=bySinger[st.singer];else if(st.view==='titles')ids=titleLetter[st.letter];
  if(!ids||!ol){st.shown+=PAGE;render();return}
  const from=st.shown;st.shown=Math.min(st.shown+PAGE,ids.length);
  ol.insertAdjacentHTML('beforeend',songRows(ids,from,st.shown,st.q));
  const b=$('more');if(b)b.outerHTML=moreBtn(ids.length);
}
function top(){const d=document.querySelector('.deck');window.scrollTo({top:Math.max(0,d.offsetTop-0),behavior:'auto'})}

let timer=null;
$('q').addEventListener('input',e=>{
  clearTimeout(timer);const v=e.target.value.trim().toLowerCase();
  $('clear').hidden=!e.target.value;
  timer=setTimeout(()=>{st.q=v.length>=2||/^\d+$/.test(v)?v:'';st.shown=PAGE;if(st.q)st.singer=null;render()},160)});
$('clear').addEventListener('click',()=>{$('q').value='';$('clear').hidden=true;st.q='';st.shown=PAGE;render();$('q').focus()});
function setView(v){st.view=v;st.singer=null;st.q='';$('q').value='';$('clear').hidden=true;st.shown=PAGE;
  try{localStorage.setItem('songhub.view',v)}catch(e){}
  const src=v==='titles'?titleLetter:singerLetter;if(!src[st.letter].length)st.letter='A';render();top()}
$('tabTitles').addEventListener('click',()=>setView('titles'));
$('tabSingers').addEventListener('click',()=>setView('singers'));
$('letters').addEventListener('click',e=>{const b=e.target.closest('button[data-letter]');if(!b)return;
  st.letter=b.dataset.letter;st.singer=null;st.q='';$('q').value='';$('clear').hidden=true;st.shown=PAGE;render();top()});

const toast=$('toast');let tt=null;
function say(t){toast.textContent=t;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),1600)}
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-copy]');
  if(c){const n=c.dataset.copy;
    const p=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(n):Promise.reject();
    p.then(()=>say('Copied song '+n)).catch(()=>{const r=document.createRange();r.selectNodeContents(c);const s=getSelection();s.removeAllRanges();s.addRange(r);say('Song '+n+' selected')});return}
  const s=e.target.closest('[data-singer]');
  if(s){st.singer=+s.dataset.singer;if(st.view==='singers')st.letter=letterOf(ARTISTS[st.singer]);st.q='';$('q').value='';$('clear').hidden=true;st.shown=PAGE;render();top();return}
  if(e.target.id==='more'){appendMore();return}
  if(e.target.id==='back'){st.singer=null;st.shown=PAGE;render();top()}
});
render();
})();
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
let deferred=null;const ib=document.getElementById('install');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;ib.hidden=false});
ib.addEventListener('click',async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;ib.hidden=true});
addEventListener('appinstalled',()=>{ib.hidden=true});
</script>
</body>
</html>
